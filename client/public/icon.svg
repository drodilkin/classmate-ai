<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="orbGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Triad connection network representing Claude, DeepSeek, Gemini -->
  <g filter="url(#glow)">
    <line x1="256" y1="130" x2="140" y2="340" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.6" stroke-dasharray="8 6" />
    <line x1="256" y1="130" x2="372" y2="340" stroke="#10b981" stroke-width="6" stroke-opacity="0.6" stroke-dasharray="8 6" />
    <line x1="140" y1="340" x2="372" y2="340" stroke="#d97706" stroke-width="6" stroke-opacity="0.6" stroke-dasharray="8 6" />
  </g>

  <!-- Central Nexus Core -->
  <circle cx="256" cy="270" r="45" fill="#1e293b" stroke="#818cf8" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="270" r="24" fill="#6366f1" opacity="0.9" />

  <!-- Node 1: Claude (Amber/Orange) -->
  <circle cx="256" cy="130" r="48" fill="url(#orbGrad1)" filter="url(#glow)" />
  <text x="256" y="142" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Node 2: DeepSeek (Blue) -->
  <circle cx="140" cy="340" r="48" fill="url(#orbGrad2)" filter="url(#glow)" />
  <text x="140" y="352" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>

  <!-- Node 3: Gemini (Emerald/Green) -->
  <circle cx="372" cy="340" r="48" fill="url(#orbGrad3)" filter="url(#glow)" />
  <text x="372" y="352" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>

  <!-- Decorative small sparks -->
  <circle cx="198" cy="235" r="4" fill="#60a5fa" />
  <circle cx="314" cy="235" r="4" fill="#34d399" />
  <circle cx="256" cy="340" r="4" fill="#fbbf24" />
</svg>
